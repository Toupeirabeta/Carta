<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Carta de Declaração</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Jost:wght@300;400&family=Pinyon+Script&display=swap">
<style>
/* Layout: palco escuro, envelope de partículas no centro; a carta (HTML) fica entre duas camadas de canvas
   para poder sair de dentro do envelope. Visual único e escuro de propósito (sem tema claro). */
:root{
  --bg:#12080e; --bg-glow:#2b1121;
  --blush:#ffd6e0; --rose:#ff86a4; --seal:#ff4673; --gold:#f6dcae;
  --paper:#fbf1ef; --paper-2:#f4e3e2; --ink:#3d2030; --ink-rose:#a3304f; --ui:#f3cbd6;
  --f-script:'Pinyon Script','Snell Roundhand',cursive;
  --f-hand:'Caveat','Segoe Script','Bradley Hand',cursive;
  --f-ui:'Jost','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
html{overflow:hidden;background:var(--bg)}
body{
  margin:0;box-sizing:border-box;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse 80% 70% at 50% 46%,var(--bg-glow) 0%,var(--bg) 72%),var(--bg);
  color:var(--ui);font-family:var(--f-ui);
  -webkit-tap-highlight-color:transparent;
}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#cvBack{z-index:1}
#cvFront{z-index:3}
#glow{
  position:fixed;left:0;top:0;z-index:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,90,130,.26) 0%,rgba(255,90,130,.08) 42%,transparent 68%);
}

/* ---------- carta ---------- */
#letterWrap{position:fixed;inset:0;z-index:2;pointer-events:none;perspective:1800px}
#letterWrap.front{z-index:4}
#letter{
  position:absolute;left:0;top:0;transform-origin:0 0;transform-style:preserve-3d;visibility:hidden;
}
.panel{
  position:relative;transform-style:preserve-3d;backface-visibility:hidden;
  background:linear-gradient(180deg,var(--paper),var(--paper-2));
  box-shadow:0 10px 30px rgba(0,0,0,.4);border-radius:3px;
}
.p1{position:absolute;inset:0}
.p2,.p3{position:absolute;left:0;top:100%;width:100%;height:100%;transform-origin:50% 0}
.panel::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.7;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .22  0 0 0 0 .28  0 0 0 .1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.p1::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(0deg,rgba(90,30,50,.12),transparent 9%)}
.p2::after,.p3::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(90,30,50,.18),transparent 13%)}
.txt{position:relative;z-index:1;box-sizing:border-box;height:100%;overflow:hidden;color:var(--ink);font:500 22px/1.3 var(--f-hand);transition:opacity .35s ease}
.txt .in{position:absolute}
.in p{margin:0 0 .55em}
.in p:last-child{margin-bottom:0}
.par{white-space:pre-line}
.greet{font:400 1.75em/1.1 var(--f-script);color:var(--ink-rose);margin-bottom:.35em!important}
.closing{margin-top:.7em!important}
.sign{font:400 1.6em/1.1 var(--f-script);color:var(--ink-rose);text-align:right}
#letterWrap.reading .txt{opacity:0}
.panel::after{transition:opacity .4s ease}
/* carta aberta: uma folha só, com marcas de dobra discretas no lugar dos cortes */
#sheet{
  position:absolute;opacity:0;transition:opacity .2s ease;pointer-events:none;border-radius:3px;
  background:linear-gradient(180deg,var(--paper),var(--paper-2));box-shadow:0 14px 40px rgba(0,0,0,.45);
}
#letterWrap.sheet #sheet{opacity:1}
#letterWrap.reading .panel{background:transparent;box-shadow:none;border-radius:0}
#letterWrap.reading .p1::after{opacity:0}
#letterWrap.reading .p2::after,#letterWrap.reading .p3::after{
  background:linear-gradient(180deg,rgba(110,50,70,.16) 0,rgba(110,50,70,.16) 1px,rgba(255,255,255,.28) 1px,rgba(255,255,255,0) 5px,rgba(110,50,70,.04) 5px,rgba(110,50,70,0) 22px);
}
/* leitura: texto contínuo sobre a folha aberta, com rolagem quando a carta é longa */
#read{
  position:absolute;box-sizing:border-box;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;
  opacity:0;pointer-events:none;transition:opacity .35s ease;color:var(--ink);font:500 22px/1.3 var(--f-hand);
}
#read::-webkit-scrollbar{display:none}
#read.on{opacity:1;pointer-events:auto}
#read:focus-visible{outline:2px solid var(--ink-rose);outline-offset:-6px}
#readFade{position:absolute;pointer-events:none;opacity:0;transition:opacity .3s;border-radius:0 0 3px 3px;background:linear-gradient(180deg,rgba(244,227,226,0),var(--paper-2) 85%)}
#readFade.on{opacity:1}
#rbar{position:absolute;width:3px;border-radius:2px;background:rgba(163,48,79,.5);pointer-events:none;opacity:0;transition:opacity .3s}
#rbar.on{opacity:1}

/* ---------- interface ---------- */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#kicker{
  position:fixed;left:0;right:0;z-index:5;top:calc(env(safe-area-inset-top,0px) + 26px);
  padding:0 max(16px,env(safe-area-inset-left,0px));text-align:center;pointer-events:none;
  font:400 clamp(26px,6.4vw,48px)/1.1 var(--f-script);color:var(--blush);
  text-shadow:0 0 28px rgba(255,90,130,.45);opacity:0;transition:opacity 1.4s ease;
}
#kicker.show{opacity:1}
.btn{
  position:fixed;left:50%;z-index:5;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 42px);
  background:rgba(18,8,14,.35);border:1px solid rgba(255,214,224,.38);color:var(--ui);
  font:300 13px/1 var(--f-ui);letter-spacing:.32em;text-transform:uppercase;white-space:nowrap;
  padding:15px 24px 15px 28px;border-radius:999px;cursor:pointer;
  opacity:0;pointer-events:none;transition:opacity 1s ease,border-color .3s;
}
.btn.show{opacity:1;pointer-events:auto}
#hint.show{animation:pulse 2.8s ease-in-out infinite}
.btn:hover{border-color:rgba(255,214,224,.85)}
.btn:focus-visible{outline:2px solid var(--blush);outline-offset:4px}
@keyframes pulse{50%{border-color:rgba(255,214,224,.85);box-shadow:0 0 26px rgba(255,90,130,.3)}}
@media (prefers-reduced-motion:reduce){#hint.show{animation:none}}
#foot{
  position:fixed;left:0;right:0;z-index:5;pointer-events:none;text-align:center;
  bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  padding:0 max(16px,env(safe-area-inset-left,0px));
  font:300 11px/1.3 var(--f-ui);letter-spacing:.14em;color:rgba(243,203,214,.55);
}

/* ---------- lista de cartas ---------- */
#hub{
  position:fixed;inset:0;z-index:6;overflow-y:auto;overscroll-behavior:contain;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;
  padding-top:calc(env(safe-area-inset-top,0px) + 28px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 56px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  animation:hubIn .8s ease both;
}
@keyframes hubIn{from{opacity:0}to{opacity:1}}
#hub[hidden]{display:none}
.hwrap{margin:auto 0;width:100%;max-width:640px;display:flex;flex-direction:column;gap:30px}
.hhead{text-align:center;display:flex;flex-direction:column;gap:10px}
.hhead h1{margin:0;font:400 clamp(38px,9vw,60px)/1.05 var(--f-script);color:var(--blush);text-shadow:0 0 30px rgba(255,90,130,.45);text-wrap:balance}
.hhead p{margin:0;font:300 14px/1.5 var(--f-ui);letter-spacing:.06em;color:rgba(243,203,214,.78)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{
  appearance:none;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0;
  padding:22px 12px 18px;border-radius:14px;cursor:pointer;color:var(--ui);font:inherit;text-align:center;
  background:rgba(255,214,224,.055);border:1px solid rgba(255,214,224,.26);
  transition:transform .25s ease,border-color .25s,background .25s;
}
.card:hover{transform:translateY(-3px);border-color:rgba(255,214,224,.6);background:rgba(255,214,224,.09)}
.card:focus-visible{outline:2px solid var(--blush);outline-offset:3px}
.card .ico{width:84px;max-width:100%;height:auto;color:var(--blush)}
.card .no{font:400 12px/1 var(--f-ui);letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.card .cap{font:400 22px/1.1 var(--f-script);color:var(--blush);min-height:2.2em;display:flex;align-items:center;justify-content:center;overflow-wrap:anywhere}
.card.plain .cap{font:300 13px/1.2 var(--f-ui);letter-spacing:.14em;color:rgba(243,203,214,.7)}
.card.locked{cursor:not-allowed;border-style:dashed;border-color:rgba(255,214,224,.16);background:rgba(255,214,224,.025)}
.card.locked:hover{transform:none;border-color:rgba(255,214,224,.26);background:rgba(255,214,224,.035)}
.card.locked .ico{color:rgba(246,220,174,.5)}
.card.locked .no{color:rgba(246,220,174,.5)}
.card.locked .cap{color:rgba(243,203,214,.45)}
.card.shake{animation:shake .4s ease}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){.card.shake,#hub{animation:none}}
#back{
  position:fixed;z-index:7;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(14px,env(safe-area-inset-left,0px));
  width:42px;height:42px;padding:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  background:rgba(18,8,14,.35);border:1px solid rgba(255,214,224,.32);color:var(--ui);
  opacity:0;pointer-events:none;transition:opacity .6s ease,border-color .3s;
}
#back.show{opacity:1;pointer-events:auto}
#back:hover{border-color:rgba(255,214,224,.85)}
#back:focus-visible{outline:2px solid var(--blush);outline-offset:4px}
</style>

<div id="glow" aria-hidden="true"></div>
<canvas id="cvBack" aria-hidden="true"></canvas>

<div id="letterWrap">
  <div id="sheet"></div>
  <div id="letter">
    <div class="panel p1" id="p1">
      <div class="panel p2" id="p2">

<script>
(() => {

const CARTA_1 = {

    "Eu amo você inteira.",
    "E depois de mais de dez anos, o meu amor por você não é aquele amor de começo de relacionamento, que existe apenas pela novidade. É um amor que conheceu a rotina, conheceu as dificuldades, conheceu os dias bons e os dias ruins. É um amor que passou pelo tempo e continuou aqui.",
    "Mesmo nesses sete meses em que estamos morando em casas diferentes, mesmo com a distância e com a saudade, eu continuo amando você.",

    "Eu penso muito no nosso futuro. Penso na vida que ainda quero construir ao seu lado. Penso nos lugares que ainda quero conhecer com você, nas coisas que ainda quero viver, nos momentos que ainda quero guardar na memória.",

    "Mas existe uma coisa que eu sei:",
    "eu te amo muito.",
    "E eu sinto sua falta todos os dias.",
    "Sinto falta de ter você perto, de poder te abraçar, de olhar para você e simplesmente saber que você está ali.",
    "Mas eu também tenho esperança.",
    "Porque eu acredito que essa distância é apenas uma parte da nossa história, não o final dela.",
    "Muito em breve, eu quero que a gente esteja junto novamente. Quero poder matar toda essa saudade com um abraço demorado, olhar nos seus olhos castanhos e lembrar exatamente por que, depois de tantos anos, meu coração ainda bate tão forte por você.",
    "E quando esse dia chegar, eu quero aproveitar cada segundo.",
    "Quero segurar sua mão e seguir em frente com você.",
    "Porque, depois de mais de dez anos, entre tudo que mudou, tudo que vivemos e tudo que ainda está por vir, uma coisa continua exatamente igual:",

    "E se a vida me desse a chance de voltar ao começo de tudo, sabendo de todas as dificuldades que enfrentaríamos, sabendo de todos os momentos que viveríamos…",

    "E outra.",

const LETTERS = [
  CARTA_1,
  {                                                                           // № 2
    greeting: "Carta de Saudade",
    // cada item é uma estrofe; as quebras de linha dentro dela são mantidas

const P = [];
function build() {
  P.length = 0;

    g, nx, ny, x: 0, y: 0, vx: 0, vy: 0, c: o.c, s: o.s * (0.8 + Math.random() * 0.4),

    for (let i = 0; i <= n; i++) { const t = i / n; add(g, ax + (bx - ax) * t + (Math.random() - .5) * .004, ay + (by - ay) * t + (Math.random() - .5) * .006, o); }
  };

    const area = 0.5 * Math.abs((b[0] - a[0]) * (c[1] - a[1]) - (c[0] - a[0]) * (b[1] - a[1])) * W * H;
    const n = Math.round(area / dens);

      let r1 = Math.random(), r2 = Math.random(); if (r1 + r2 > 1) { r1 = 1 - r1; r2 = 1 - r2; }
      add(g, a[0] + (b[0] - a[0]) * r1 + (c[0] - a[0]) * r2, a[1] + (b[1] - a[1]) * r1 + (c[1] - a[1]) * r2, o);
    }
  };
  const OUT = { c: 0, s: 1.3, a: .95, k: 1 }, FILL = { c: 1, s: 1.05, a: .5 }, LIN = { c: 4, s: 1.1, a: .5 };

  line('B', -.5, -.5, .5, -.5, OUT);
  tri('B', [-.5, -.5], [.5, -.5], [0, .02], LIN);
  // frente do envelope
  line('F', -.5, -.5, -.5, .5, OUT); line('F', .5, -.5, .5, .5, OUT); line('F', -.5, .5, .5, .5, OUT);
  line('F', -.5, -.5, 0, .02, OUT); line('F', .5, -.5, 0, .02, OUT);
  line('F', -.5, .5, 0, .02, OUT); line('F', .5, .5, 0, .02, OUT);
  tri('F', [-.5, -.5], [0, .02], [-.5, .5], FILL);
  tri('F', [.5, -.5], [0, .02], [.5, .5], FILL);
  tri('F', [-.5, .5], [.5, .5], [0, .02], FILL);
  // aba (gira em torno da borda de cima)
  line('L', -.5, -.5, 0, .1, { c: 2, s: 1.3, a: .95, k: 1 }); line('L', .5, -.5, 0, .1, { c: 2, s: 1.3, a: .95, k: 1 });
  tri('L', [-.5, -.5], [.5, -.5], [0, .1], { c: 1, s: 1.05, a: .5 });
  // selo em formato de coração
  for (let i = 0; i < 150;) {
    const x = Math.random() * 2.6 - 1.3, y = Math.random() * 2.6 - 1.3;
    if (Math.pow(x * x + y * y - 1, 3) - x * x * y * y * y <= 0) { add('L', x * .05, .03 - y * .078, { c: 3, s: 1.7, a: .98, seal: true }); i++; }
  }

  const nd = vw < 520 ? 90 : 170;
  for (let i = 0; i < nd; i++) P.push({
    g: 'D', x: Math.random() * vw, y: Math.random() * vh, vx: (Math.random() - .5) * .25, vy: -.1 - Math.random() * .35,
    c: [0, 2, 1][i % 3], s: .5 + Math.random() * 1.3, a: .15 + Math.random() * .4, ph: Math.random() * TAU, k: 0, d: 0, life: 1, lifeMs: 1

    const a = Math.random() * TAU, r = Math.max(vw, vh) * (.3 + Math.random() * .5);

  }
}

  const kind = KINDS[(Math.random() * KINDS.length) | 0];
  const sc = ((kind === 'white' || kind === 'tri' ? .62 : .52) + Math.random() * .3) * (vw < 520 ? .8 : 1), half = 50 * sc;
  const ex = state === 'hub' ? 320 + half + 16 : (state === 'opening' || state === 'open' ? rw : W) / 2 + half + 24;   // na lista, só nas laterais da coluna de cartas
  let x;
  if (cx - ex > 50) x = cx + (Math.random() < .5 ? -1 : 1) * (ex + Math.random() * Math.max(0, cx - ex - half - 12));
  else if (state === 'hub') return;   // tela estreita: a lista fica limpa, sem formas por cima dos cartões
  else x = 30 + Math.random() * (vw - 60);
  floaters.push({ kind, sc, x, y: anyY ? vh * (.15 + Math.random() * .7) : vh + half + 10, vy: .6 + Math.random() * .6, amp: 8 + Math.random() * 16, sw: .6 + Math.random() * .6, ph: Math.random() * TAU, rot0: (Math.random() - .5) * .5, age: 0 });
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(now - last, 40); last = now; const dtn = dt / 16.667;
  const tI = now - tStart;

  if (state === 'intro' && tI > 3300) { state = 'idle'; ui.kicker.classList.add('show'); ui.hint.classList.add('show'); for (let i = 0; i < (RM ? 1 : 3); i++) spawnFloater(true); }

  let theta = 0, q = 0, z = 0, u = 0, e = 0;
  if (state === 'opening' || state === 'open') {
    e = (now - tClick) / TS;
    theta = ease(seg(e, T.flap)) * Math.PI; q = ease(seg(e, T.rise)); z = ease(seg(e, T.zoom)); u = ease(seg(e, T.unfold));
    if (state === 'opening' && e > T.unfold[1] + 200) { state = 'open'; ui.again.classList.add('show'); ui.status.textContent = 'Carta aberta'; read.scrollTop = 0; read.classList.add('on'); wrap.classList.add('reading'); updScroll(); }
  }

  bobSm += ((state === 'intro' || state === 'idle' ? 1 : 0) - bobSm) * .04 * dtn;
  const bob = RM ? 0 : Math.sin(now / 1300) * 3 * bobSm;
  const cyE = cy + bob, dropPx = z * vh * .35, envA = 1 - .85 * z;
  const swirl = state === 'intro' && !RM ? Math.max(0, 1 - tI / 2600) : 0;
  const rep = (state === 'idle' || state === 'open') && !RM;
  const kBase = state === 'intro' ? .012 + .038 * clamp((tI - 1600) / 1600) : .05;
  const bt = RM ? 0 : Math.pow(Math.max(0, Math.sin(now / 240)), 12) * (state === 'opening' || state === 'open' ? 0 : 1);

  cb.clearRect(0, 0, vw, vh); cf.clearRect(0, 0, vw, vh); lc.b = lc.f = -1;

  for (const p of P) {
    if (state === 'hub' && p.g !== 'D') continue;
    if (p.g === 'D') {
      p.x += p.vx * dtn + Math.sin(now / 1700 + p.ph) * .12; p.y += p.vy * dtn;
      if (p.y < -10) p.y = vh + 10; if (p.y > vh + 10) p.y = -10;
      if (p.x < -10) p.x = vw + 10; if (p.x > vw + 10) p.x = -10;
      drawP(cb, 'b', p, p.a * (.6 + .4 * Math.sin(now / 600 + p.ph)) * clamp(tI / 1200));
      continue;
    }
    if (p.g === 'X') {
      if (p.life <= 0) continue;
      const dm = Math.pow(.985, dtn);
      p.vy += .05 * dtn; p.vx *= dm; p.vy *= dm; p.x += p.vx * dtn; p.y += p.vy * dtn; p.life -= dt / p.lifeMs;
      if (p.life > 0) drawP(cf, 'f', p, p.life * p.a);
      continue;
    }
    if (tI < p.d) continue;
    const born = Math.min(1, (tI - p.d) / 700);
    const wob = RM ? 0 : Math.sin(now / 900 + p.ph) * .9;
    let nx = p.nx, ny = p.ny;
    if (p.seal) { nx *= 1 + .1 * bt; ny = .03 + (ny - .03) * (1 + .1 * bt); }
    const tx = cx + nx * W + wob * .7;
    const ty = p.g === 'L' ? cyE - H / 2 + (ny + .5) * H * Math.cos(theta) + wob * .5 + dropPx
                           : cyE + ny * H + wob * .5 + dropPx;
    const k = p.g === 'L' ? .12 : kBase, damp = p.g === 'L' ? .72 : .84;
    p.vx += (tx - p.x) * k * dtn; p.vy += (ty - p.y) * k * dtn;
    if (swirl > 0) { const rx = p.x - cx, ry = p.y - cy; p.vx += -ry * .0035 * swirl * dtn; p.vy += rx * .0035 * swirl * dtn; }
    if (rep) {
      const mx = p.x - ptr.x, my = p.y - ptr.y, d2 = mx * mx + my * my;
      if (d2 < 6400 && d2 > 1) { const d = Math.sqrt(d2), f = (1 - d / 80) * 2.4; p.vx += mx / d * f * dtn; p.vy += my / d * f * dtn; }
    }
    const dm = Math.pow(damp, dtn); p.vx *= dm; p.vy *= dm; p.x += p.vx * dtn; p.y += p.vy * dtn;

    let al = p.a * born * envA * (.78 + .22 * Math.sin(now / 520 + p.ph * 3));
    if (p.g === 'L') al *= .5 + .5 * Math.abs(Math.cos(theta));
    if (p.seal && bt > 0) al = Math.min(1, al + .25 * bt);
    if (p.g === 'B') drawP(cb, 'b', p, al);
    else if (p.g === 'F') drawP(cf, 'f', p, al);
    else if (theta <= Math.PI / 2) drawP(cf, 'f', p, al);
    else drawP(cb, 'b', p, al);
  }

  /* corações que sobem depois da abertura */
  if ((state === 'opening' && e > 3400) || state === 'open') {
    heartT -= dt;
    if (heartT <= 0 && hearts.length < 22) {
      heartT = 380 + Math.random() * 500;
      hearts.push({ x: Math.random() < .5 ? vw * (.05 + Math.random() * .25) : vw * (.7 + Math.random() * .25), y: vh + 20, vy: .5 + Math.random() * .7, s: 5 + Math.random() * 9, ph: Math.random() * TAU });
    }
  }
  for (let i = hearts.length - 1; i >= 0; i--) {
    const h = hearts[i]; h.y -= h.vy * dtn; h.x += Math.sin(now / 900 + h.ph) * .3;
    if (h.y < -30) { hearts.splice(i, 1); continue; }
    drawHeart(cb, h.x, h.y, h.s, Math.min(1, (vh - h.y) / 120) * Math.min(1, h.y / 120) * .5);
  }

  /* gatinhos e patinhas de partículas subindo pelos lados */
  if (state !== 'intro') {
    floatT -= dt;
    const maxF = RM ? 2 : (vw < 520 ? 4 : 7);
    if (floatT <= 0 && floaters.length < maxF) { spawnFloater(false); floatT = 900 + Math.random() * 1400; }
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i], half = 50 * f.sc;
    f.y -= f.vy * dtn * (RM ? .5 : 1); f.age += dt;
    if (f.y < -half - 40) { floaters.splice(i, 1); continue; }
    const fin = ease(clamp(f.age / 1100)), fout = clamp((f.y + half) / 170);
    const al = .85 * clamp(fin * 2) * fout, sp = (1 - fin) * 50 + (1 - fout) * 40;
    const cxf = f.x + Math.sin(now / 900 * f.sw + f.ph) * f.amp, ang = f.rot0 + Math.sin(now / 1300 + f.ph) * .1;
    const ca = Math.cos(ang), sa = Math.sin(ang), r = Math.max(.8, shapeStep * f.sc * .48);
    let lastCi = -1;
    for (const q of SHAPES[f.kind]) {
      const ux = (q.x - 50) * f.sc, uy = (q.y - 50) * f.sc, jit = RM ? 0 : Math.sin(now / 300 + q.rx * 9) * .5;
      if (q.ci !== lastCi) { cb.fillStyle = FPAL[q.ci]; lastCi = q.ci; }
      cb.globalAlpha = al * (.8 + .2 * Math.sin(now / 420 + q.rx * 20));
      cb.beginPath(); cb.arc(cxf + ux * ca - uy * sa + q.rx * sp + jit, f.y + ux * sa + uy * ca + q.ry * sp + jit, r, 0, TAU); cb.fill();
    }
  }
  lc.b = -1;

  /* carta */
  if (state === 'opening' || state === 'open') {
    const top0 = cyE + H / 2 - 8 - hf, topEnd = cyE - H / 2 - 6 - hf, topFinal = (vh - 3 * pr) / 2;
    const top = z > 0 ? topEnd + (topFinal - topEnd) * z : top0 + (topEnd - top0) * q;
    const s = s0 + (1 - s0) * z, left = cx - rw * s / 2;
    letter.style.transform = 'translate(' + left + 'px,' + top + 'px) scale(' + s + ')';
    letter.style.visibility = theta > Math.PI / 2 ? 'visible' : 'hidden';
    setFold(u);
    if (u > .85 && !sheetOn) { sheetOn = true; wrap.classList.add('sheet'); }
    wrap.style.perspectiveOrigin = cx + 'px ' + (top + 1.5 * pr * s) + 'px';
    if (q < 1) {
      const L = cx - W / 2, R = cx + W / 2, Tt = cyE - H / 2, Vy = cyE + .02 * H;
      wrap.style.clipPath = 'polygon(0px 0px,' + vw + 'px 0px,' + vw + 'px ' + Tt + 'px,' + R + 'px ' + Tt + 'px,' + cx + 'px ' + Vy + 'px,' + L + 'px ' + Tt + 'px,0px ' + Tt + 'px)';
    } else if (!frontMode) { wrap.style.clipPath = 'none'; wrap.classList.add('front'); frontMode = true; }
  }

  /* brilho atrás do envelope / da carta */
  const gs = W * 1.9 * (1 - z) + rw * 1.8 * z, gy = cyE + (vh / 2 - cyE) * z;
  glow.style.width = glow.style.height = gs + 'px';
  glow.style.transform = 'translate(' + (cx - gs / 2) + 'px,' + (gy - gs / 2) + 'px)';
  glow.style.opacity = clamp(tI / 1500) * (.65 + .2 * Math.sin(now / 900));
}

function onResize() { layout(); fitAll(); }
let rz = 0;
addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(onResize); });

back.addEventListener('click', e => { e.stopPropagation(); goHub(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && state !== 'hub') goHub(); });

layout(); buildLetter(); renderLetter(LETTERS[0]); setFold(0); fitAll(); buildShapes(); build();
goHub();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
requestAnimationFrame(frame);
})();
</script>

</body></html>
